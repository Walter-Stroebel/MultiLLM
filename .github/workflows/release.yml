name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B package
      - uses: softprops/action-gh-release@v2
        with:
          files: target/MultiLLM-*-jar-with-dependencies.jar
          generate_release_notes: true
