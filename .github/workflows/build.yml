name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B package
      - uses: actions/upload-artifact@v5
        with:
          name: MultiLLM-jar
          path: target/MultiLLM-*-jar-with-dependencies.jar
